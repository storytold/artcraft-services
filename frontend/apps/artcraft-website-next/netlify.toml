# Netlify settings used to discover this file:
#   Base directory:    frontend/apps/artcraft-website-next
#   (this app is standalone — its own package-lock.json, not the Nx workspace)
# Manage the build command and publish directory here; leave those UI fields empty.
# The Next.js runtime handles routing, the /cdn-media proxy rewrite, and the
# legacy-route redirects declared in next.config.ts. Other media is in public/.

[build]
command = "npm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Share links. The Next runtime serves /media/:token itself (src/app/media);
# this only maps the legacy query form the Vite site accepted onto the
# canonical route at the edge. Also declared in next.config.ts for local dev.
[[redirects]]
  from = "/media"
  query = { media = ":token" }
  to = "/media/:token"
  status = 301
  force = true

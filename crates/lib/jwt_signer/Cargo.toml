[package]
name = "jwt_signer"
edition = "2018"
version = "0.0.1"
authors = [
    "Brandon Thomas <bt@brand.io>",
    "Brandon Thomas <echelon@gmail.com>",
]
publish = false

[lib]
name = "jwt_signer"
path = "src/lib.rs"

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-build-acceleration"]

[dependencies]
# Workspace hack (faster compile times)
workspace-build-acceleration = { version = "0.1", path = "../../workspace-build-acceleration" }

# External
# NB: `jsonwebtoken` replaces the unmaintained `jwt` crate (RUSTSEC-2016-0007). HMAC-SHA256 is
# all we use, so the PEM/RSA support is not compiled in.
jsonwebtoken = { version = "9.3.1", default-features = false }
serde.workspace = true

[dev-dependencies]
# None yet

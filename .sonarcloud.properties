# SonarCloud automatic analysis (the "SonarCloud Code Analysis" GitHub App
# check) reads this file from the default branch. The repo has no
# sonar-project.properties, and while automatic analysis is on SonarCloud
# ignores both that file and the scope set in its UI, so the scope lives here.
#
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# Vendored third-party code is not ours and is not worth analysing:
# crates/vendor/candle/candle-flash-attn/cutlass/ ships generated Doxygen HTML
# and a copied Python tree, which accounted for 194,232 of this project's
# 197,233 open findings. They come back whenever the vendor copy is bumped, so
# fixing them by hand is wasted work, and they drown the real findings.
sonar.exclusions=crates/vendor/**

# Same scope for copy-paste detection: the vendored HTML/Python is most of the
# duplicated lines, so it should not count against this project either.
sonar.cpd.exclusions=crates/vendor/**

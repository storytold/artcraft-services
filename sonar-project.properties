sonar.projectKey=storytold_artcraft-services
sonar.organization=storytold

# Vendored third-party code is not ours and is not worth analysing:
# crates/vendor/candle/candle-flash-attn/cutlass/ ships generated Doxygen HTML and a copied Python
# tree, which accounted for 194,232 of this project's 197,233 open findings under automatic
# analysis. They come back whenever the vendor copy is bumped and drown the real findings.
# _docs/old/ is the retired local-dev setup (an old Dockerfile and kubernetes.yml nothing uses).
sonar.exclusions=crates/vendor/**,_docs/old/**
# Same scope for copy-paste detection: the vendored HTML/Python is most of the duplicated lines.
sonar.cpd.exclusions=crates/vendor/**

# CI publishes Rust coverage only; TypeScript and JavaScript would never appear covered.
# Same as artcraft.
sonar.coverage.exclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs

# githubactions:S7637 asks for every action to be pinned to a commit SHA. A workflow covered by
# .github/workflows/actions.lock runs the commit the lockfile records, so its tag refs are pinned
# and the lockfile covers the actions those actions use too. Sonar does not read lockfiles yet, so
# the rule flags the tag refs anyway:
# https://community.sonarsource.com/t/githubactions-s7637-false-positives-for-actions-pinned-through-native-actions-lock/190814
sonar.issue.ignore.multicriteria=gha-lockfile
sonar.issue.ignore.multicriteria.gha-lockfile.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha-lockfile.resourceKey=.github/workflows/**

name: Linux package repository tools

on:
  pull_request:
    paths:
      - 'frontend/apps/artcraft-website-next/**'
      - '.github/workflows/linux-distro-tools.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/apps/artcraft-website-next/**'
      - '.github/workflows/linux-distro-tools.yml'

permissions:
  contents: read

jobs:
  test-distro-tools:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04 (APT)"
            distro: ubuntu
          - name: "Fedora (DNF)"
            distro: fedora
          - name: "openSUSE (Zypper)"
            distro: opensuse
    defaults:
      run:
        working-directory: frontend/apps/artcraft-website-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/next typegen
      - run: npm run build
      - name: Verify repository via ${{ matrix.name }}
        run: ./scripts/test-distro-repos.sh ${{ matrix.distro }}

name: Linux package repository tools

on:
  pull_request:
    paths:
      - 'frontend/apps/artcraft-website-next/**'
      - '.github/workflows/linux-distro-tools.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/apps/artcraft-website-next/**'
      - '.github/workflows/linux-distro-tools.yml'

permissions:
  contents: read

jobs:
  wait-for-deploy:
    name: Wait for Netlify deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    timeout-minutes: 20
    outputs:
      deploy-url: ${{ steps.wait.outputs.deploy_url }}
    steps:
      - name: Await Netlify deploy
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The distro tests below run against a real deployment, never a server started here.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            TARGET_SHA="${{ github.event.pull_request.head.sha }}"
            DEPLOY_URL="https://deploy-preview-${PR_NUMBER}--artcraft-website-next.netlify.app"
            echo "Awaiting Netlify deploy preview for PR #${PR_NUMBER} (commit ${TARGET_SHA}) at ${DEPLOY_URL}..."
          else
            TARGET_SHA="${{ github.sha }}"
            DEPLOY_URL="https://getartcraft.com"
            echo "Testing the production deployment of ${TARGET_SHA} at ${DEPLOY_URL}..."
          fi

          saw_status=0
          for i in {1..90}; do
            STATUS=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/statuses" \
              --jq '[.[] | select(.context | startswith("netlify/"))][0].state' 2>/dev/null || true)
            [[ -n "$STATUS" ]] && saw_status=1

            if [[ "$STATUS" == "failure" || "$STATUS" == "error" ]]; then
              echo "Error: the Netlify deploy reported failure!" >&2
              exit 1
            fi

            ready=0
            [[ "$STATUS" == "success" ]] && ready=1
            # Without a Netlify status check on this commit, fall back to the site coming up.
            [[ "$saw_status" == "0" && "$i" -gt 12 ]] && ready=1

            if [[ "$ready" == "1" ]] && curl -sf -o /dev/null "${DEPLOY_URL}/apt/artcraft.sources" 2>/dev/null; then
              echo "Deployment is live and responsive at ${DEPLOY_URL} (attempt $i)!"
              echo "Warming up package repository endpoints..."
              curl -sf -m 60 -o /dev/null "${DEPLOY_URL}/apt/dists/stable/Release" 2>/dev/null || true
              curl -sf -m 60 -o /dev/null "${DEPLOY_URL}/rpm/repodata/repomd.xml" 2>/dev/null || true
              curl -sf -m 60 -o /dev/null "${DEPLOY_URL}/arch/x86_64/artcraft.db" 2>/dev/null || true
              echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $i/90: waiting for ${DEPLOY_URL} (commit status: ${STATUS:-waiting})..."
            sleep 10
          done

          echo "Error: timed out waiting for ${DEPLOY_URL} (${TARGET_SHA})" >&2
          exit 1

  test-distro-tools:
    name: ${{ matrix.name }}
    needs: wait-for-deploy
    if: needs.wait-for-deploy.outputs.deploy-url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 26.04 (APT)"
            distro: ubuntu
          - name: "Fedora 45 (DNF)"
            distro: fedora
          # libzypp rejects hostnames containing "--", so this leg reaches a deploy preview through
          # the script's forwarder while every other leg talks to the deployment directly.
          - name: "openSUSE Tumbleweed (Zypper)"
            distro: opensuse
          - name: "Flatpak OCI Remote"
            distro: flatpak
          - name: "Arch Linux (Pacman)"
            distro: arch
    defaults:
      run:
        working-directory: frontend/apps/artcraft-website-next
    env:
      # Every deployment this runs against is built with LINUX_SIGNING_KEY, so these tests drive
      # apt's Signed-By, rpmkeys, pacman's SigLevel and the Flatpak lookaside against real
      # signatures. A deployment that publishes no key fails the run instead of quietly passing with
      # trusted repositories.
      REQUIRE_SIGNED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # manifest-info.mjs runs on jiti, so the tests need the dependencies even though the site
      # itself comes from the deployment.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository via ${{ matrix.name }}
        run: ./scripts/test-distro-repos.sh ${{ matrix.distro }} "${{ needs.wait-for-deploy.outputs.deploy-url }}"

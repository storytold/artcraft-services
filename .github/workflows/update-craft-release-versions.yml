name: Update Craft Release Versions

on:
  schedule:
    # Hourly, on the hour
    - cron: "0 * * * *"
  repository_dispatch:
    # Triggered immediately when any Craft app or launcher release/prerelease is
    # published, edited, unpublished, deleted, or changes prerelease state.
    types: [craft-release-changed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-craft-release-versions
  cancel-in-progress: false

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check latest releases and update versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");

            const owner = "storytold";
            const file =
              "frontend/apps/artcraft-website-next/src/lib/crafting-app-releases.ts";

            const apps = [
              "photocraft",
              "vectorcraft",
              "filmcraft",
              "lightcraft",
              "pdfcraft",
              "effectcraft",
              "anicraft",
              "designcraft",
              "figcraft",
              "texturecraft",
              "materialcraft",
              "wordcraft",
              "soundcraft",
              "deckcraft",
              "cadcraft",
              "gridcraft",
              "craft-anything",
            ];

            const launcher = {
              repo: "craft-launcher",
              fileSlug: "artcraft-launcher",
            };

            const studio = {
              repo: "artcraft",
              fileSlug: "artcraft",
              tagPrefix: "artcraft-v",
              studioFile:
                "frontend/apps/artcraft-website-next/src/lib/artcraft-studio.ts",
              webappDownloadsFile:
                "frontend/apps/artcraft-webapp/src/config/github_download_links.ts",
            };

            // Pin a repository here to preserve an intentional rollback.
            // Example: photocraft: "0.8.0"
            // Remove the pin to resume automatic updates.
            const pinnedVersions = {};

            let content = fs.readFileSync(file, "utf8");

            const assetsMatch = content.match(
              /export const CRAFT_RELEASE_ASSETS:[\s\S]*?=\s*\[([\s\S]*?)\n\];/
            );

            if (!assetsMatch) {
              throw new Error(
                "Could not read required assets from the release catalog."
              );
            }

            const assetTemplates = [
              ...assetsMatch[1].matchAll(/\bfile:\s*"([^"]+)"/g),
            ].map(match => match[1]);

            if (assetTemplates.length === 0) {
              throw new Error(
                "No required release assets found in the catalog."
              );
            }

            function parseVersion(tag, tagPrefix = "v") {
              const escapedPrefix = tagPrefix.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
              );
              const match = tag.match(
                new RegExp(
                  `^${escapedPrefix}(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$`
                )
              );

              if (!match) return null;

              return {
                text: `${match[1]}.${match[2]}.${match[3]}`,
                parts: match.slice(1).map(Number),
              };
            }

            function compareVersions(a, b) {
              for (let i = 0; i < 3; i++) {
                if (a.parts[i] !== b.parts[i]) {
                  return a.parts[i] - b.parts[i];
                }
              }
              return 0;
            }

            function validateReleaseAssets(repo, fileSlug, release) {
              const requiredAssets =
                repo === studio.repo
                  ? [
                      ...assetTemplates
                        .filter(
                          asset =>
                            !asset.startsWith("{slug}-cli-") &&
                            // Studio publishes no portable, web, or FreeBSD builds.
                            !asset.endsWith("-portable.zip") &&
                            !asset.startsWith("{slug}-web-") &&
                            !asset.includes("-freebsd-") &&
                            !asset.endsWith(".dmg") &&
                            !asset.endsWith(".exe") &&
                            !asset.endsWith(".msi")
                        )
                        .map(asset =>
                          asset
                            .replaceAll("{slug}", fileSlug)
                            .replaceAll("{version}", release.text)
                        ),
                      `ArtCraft_${release.text}_x64-setup.exe`,
                      `ArtCraft_${release.text}_universal.dmg`,
                    ]
                  : assetTemplates
                      .filter(
                        asset =>
                          (repo !== launcher.repo ||
                            !asset.startsWith("{slug}-cli-")) &&
                          // Match AniCraft's custom download list: no web ZIP is published.
                          (repo !== "anicraft" ||
                            !asset.startsWith("{slug}-web-"))
                      )
                      .map(asset =>
                        asset
                          .replaceAll("{slug}", fileSlug)
                          .replaceAll("{version}", release.text)
                      );

              const publishedAssets = new Set(
                release.assets.map(asset => asset.name)
              );

              const missingAssets = requiredAssets.filter(
                asset => !publishedAssets.has(asset)
              );

              if (missingAssets.length > 0) {
                throw new Error(
                  `Release ${owner}/${repo}@${release.tag} is missing required assets: ${missingAssets.join(", ")}`
                );
              }
            }

            async function latestVersion(
              repo,
              fileSlug = repo,
              tagPrefix = "v"
            ) {
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                {
                  owner,
                  repo,
                  per_page: 100,
                }
              );

              const versions = releases
                .filter(
                  release => !release.draft && !release.prerelease
                )
                .map(release => {
                  const parsed = parseVersion(release.tag_name, tagPrefix);
                  if (!parsed) return null;

                  return {
                    ...parsed,
                    tag: release.tag_name,
                    assets: release.assets || [],
                  };
                })
                .filter(Boolean)
                .sort(compareVersions);

              const pinnedVersion = pinnedVersions[repo];

              const selected = pinnedVersion
                ? versions.find(
                    version => version.text === pinnedVersion
                  )
                : versions[versions.length - 1];

              if (!selected) {
                if (pinnedVersion) {
                  throw new Error(
                    `Pinned stable release ${tagPrefix}${pinnedVersion} not found for ${owner}/${repo}.`
                  );
                }

                throw new Error(
                  `No published stable ${tagPrefix}X.Y.Z releases found for ${owner}/${repo}.`
                );
              }

              validateReleaseAssets(repo, fileSlug, selected);

              core.info(`${repo}: ${selected.text} (${selected.tag})`);
              return selected.text;
            }

            // Update ArtCraft Studio Linux/Desktop version.
            const studioVersion = await latestVersion(
              studio.repo,
              studio.fileSlug,
              studio.tagPrefix
            );
            let studioContent = fs.readFileSync(studio.studioFile, "utf8");
            studioContent = studioContent
              .replace(
                /(version:\s*)"[^"]+"/,
                (_, prefix) => `${prefix}"${studioVersion}"`
              )
              .replace(
                /(tag:\s*)"artcraft-v[^"]+"/,
                (_, prefix) => `${prefix}"artcraft-v${studioVersion}"`
              );
            fs.writeFileSync(studio.studioFile, studioContent);

            if (fs.existsSync(studio.webappDownloadsFile)) {
              let webappContent = fs.readFileSync(
                studio.webappDownloadsFile,
                "utf8"
              );
              const webappVersionPattern =
                /(^const ARTCRAFT_STUDIO_VERSION = )"[^"]+"/m;
              // Test for the declaration rather than comparing the file before
              // and after: the replace is a no-op when the version is current.
              if (!webappVersionPattern.test(webappContent)) {
                throw new Error(
                  "Could not find ARTCRAFT_STUDIO_VERSION in github_download_links.ts."
                );
              }
              webappContent = webappContent.replace(
                webappVersionPattern,
                (_, prefix) => `${prefix}"${studioVersion}"`
              );
              fs.writeFileSync(studio.webappDownloadsFile, webappContent);
            }

            // Update the launcher version.
            const launcherDisabledPattern =
              /export const CRAFT_LAUNCHER_RELEASE:[\s\S]*?=\s*null\s*;/;

            const launcherPattern =
              /(export const CRAFT_LAUNCHER_RELEASE:[\s\S]*?=\s*craftRelease\(\s*)"[^"]+"/;

            if (launcherDisabledPattern.test(content)) {
              core.info(
                "craft-launcher: release disabled in catalog; preserving null."
              );
            } else {
              if (!launcherPattern.test(content)) {
                throw new Error("Could not find the launcher version.");
              }

              const launcherVersion = await latestVersion(
                launcher.repo,
                launcher.fileSlug
              );

              content = content.replace(
                launcherPattern,
                (_, prefix) => `${prefix}"${launcherVersion}"`
              );
            }

            // Update each enabled app version.
            for (const app of apps) {
              const escaped = app.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
              );

              // Slugs with a hyphen ("craft-anything") are quoted keys in the catalog.
              const disabledPattern = new RegExp(
                `(^\\s*"?${escaped}"?\\s*:\\s*)null\\s*,`,
                "m"
              );

              const pattern = new RegExp(
                `(^\\s*"?${escaped}"?\\s*:\\s*craftRelease\\()"[^"]+"`,
                "m"
              );

              if (disabledPattern.test(content)) {
                core.info(
                  `${app}: release disabled in catalog; preserving null.`
                );
                continue;
              }

              if (!pattern.test(content)) {
                throw new Error(
                  `Could not find the release entry for ${app}.`
                );
              }

              const version = await latestVersion(app);

              content = content.replace(
                pattern,
                (_, prefix) => `${prefix}"${version}"`
              );
            }

            fs.writeFileSync(file, content);

            // Update nightly releases (newest published prerelease per repo with -nightly Linux packages,
            // regardless of tag format).
            async function latestNightlyRelease(repo, fileSlug = repo) {
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 30 },
                response => response.data
              );
              const nightlyPkgPrefix = `${fileSlug}-nightly-`;
              const escapedNightlyPrefix = nightlyPkgPrefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const escapedSlug = fileSlug.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const linuxAssetPattern = new RegExp(
                `^(?:${escapedNightlyPrefix}(.+)|${escapedSlug}-([^/]+-nightly\\.[^/]+))-linux-(?:(?:x86_64|aarch64|riscv64)\\.(?:deb|rpm)|(?:x86_64|aarch64)\\.(?:pkg\\.tar\\.zst|AppImage|flatpak))$`
              );
              const published = releases
                .filter(r => !r.draft && r.prerelease)
                .sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
              for (const rel of published) {
                const names = new Set((rel.assets || []).map(a => a.name));
                if (!names.has("SHA256SUMS.txt")) continue;
                let matchedVersion = null;
                let hasFlatpak = false;
                let hasAppImage = false;
                for (const name of names) {
                  const m = name.match(linuxAssetPattern);
                  if (m) {
                    matchedVersion = matchedVersion || m[1] || m[2];
                    if (name.endsWith(".flatpak")) hasFlatpak = true;
                    if (name.endsWith(".AppImage")) hasAppImage = true;
                  }
                }
                if (matchedVersion) {
                  const entry = { tag: rel.tag_name, version: matchedVersion };
                  if (hasFlatpak) entry.flatpak = true;
                  if (hasAppImage) entry.appImage = true;
                  return entry;
                }
              }
              return null;
            }

            const nightlyTargets = [
              { key: studio.repo, repo: studio.repo, fileSlug: studio.fileSlug },
              { key: launcher.fileSlug, repo: launcher.repo, fileSlug: launcher.fileSlug },
              ...apps.map(app => ({ key: app, repo: app, fileSlug: app })),
            ];
            const nightlyEntries = {};
            for (const target of nightlyTargets) {
              const found = await latestNightlyRelease(target.repo, target.fileSlug);
              if (found) {
                nightlyEntries[target.key] = found;
              }
            }

            const nightlyBlockPattern =
              /(export const CRAFT_NIGHTLY_RELEASES:\s*Partial<[\s\S]*?>\s*=\s*)\{[\s\S]*?\};/;
            if (!nightlyBlockPattern.test(content)) {
              throw new Error("Could not find CRAFT_NIGHTLY_RELEASES in crafting-app-releases.ts.");
            }
            const formattedNightlies = Object.keys(nightlyEntries).length === 0
              ? "{}"
              : `{\n${Object.entries(nightlyEntries)
                  .map(([k, v]) => {
                    const keyStr = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
                    const extras = [
                      v.flatpak ? "flatpak: true" : null,
                      v.appImage ? "appImage: true" : null,
                    ].filter(Boolean);
                    const fields = [`tag: ${JSON.stringify(v.tag)}`, `version: ${JSON.stringify(v.version)}`, ...extras];
                    return `  ${keyStr}: { ${fields.join(", ")} },`;
                  })
                  .join("\n")}\n}`;
            content = content.replace(nightlyBlockPattern, (_, prefix) => `${prefix}${formattedNightlies};`);

            // Update non-nightly prereleases (betas / RCs) and community app releases for
            // static `launcher-catalog.toml` generation.
            function isNightlyTag(tag) {
              const stripped = tag.replace(/^[vV]/, "").split("+")[0];
              const dashIdx = stripped.indexOf("-");
              if (dashIdx === -1) return false;
              return stripped
                .slice(dashIdx + 1)
                .split(".")
                .some(part => part.toLowerCase() === "nightly");
            }

            function parseSemverTag(tag) {
              const match = tag.match(
                /^[vV]?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/
              );
              if (!match) return null;
              return {
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3]),
                pre: match[4] ? match[4].split(".") : [],
                version: tag.replace(/^[vV]/, ""),
              };
            }

            function compareSemver(a, b) {
              for (const key of ["major", "minor", "patch"]) {
                if (a[key] !== b[key]) return a[key] - b[key];
              }
              if (a.pre.length === 0 && b.pre.length === 0) return 0;
              if (a.pre.length === 0) return 1;
              if (b.pre.length === 0) return -1;
              const len = Math.min(a.pre.length, b.pre.length);
              for (let i = 0; i < len; i++) {
                const ai = a.pre[i];
                const bi = b.pre[i];
                if (ai === bi) continue;
                const aNum = /^\d+$/.test(ai);
                const bNum = /^\d+$/.test(bi);
                if (aNum && bNum) return Number(ai) - Number(bi);
                if (aNum) return -1;
                if (bNum) return 1;
                return ai < bi ? -1 : 1;
              }
              return a.pre.length - b.pre.length;
            }

            async function latestPrerelease(repoOwner, repoName) {
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner: repoOwner, repo: repoName, per_page: 50 },
                response => response.data
              );
              let best = null;
              for (const rel of releases) {
                if (rel.draft || isNightlyTag(rel.tag_name)) continue;
                const parsed = parseSemverTag(rel.tag_name);
                if (!parsed) continue;
                const isPre = rel.prerelease || parsed.pre.length > 0;
                if (!isPre) continue;
                if (!best || compareSemver(parsed, best.parsed) > 0) {
                  best = { parsed, tag: rel.tag_name, version: parsed.version };
                }
              }
              return best ? { tag: best.tag, version: best.version } : null;
            }

            const prereleaseTargets = [
              { key: launcher.fileSlug, repo: launcher.repo },
              ...apps.map(app => ({ key: app, repo: app })),
            ];
            const prereleaseEntries = {};
            for (const target of prereleaseTargets) {
              const found = await latestPrerelease(owner, target.repo);
              if (found) {
                prereleaseEntries[target.key] = found;
              }
            }

            const prereleaseBlockPattern =
              /(export const CRAFT_PRERELEASE_RELEASES:\s*Partial<[\s\S]*?>\s*=\s*)\{[\s\S]*?\};/;
            if (!prereleaseBlockPattern.test(content)) {
              throw new Error("Could not find CRAFT_PRERELEASE_RELEASES in crafting-app-releases.ts.");
            }
            const formattedPrereleases = Object.keys(prereleaseEntries).length === 0
              ? "{}"
              : `{\n${Object.entries(prereleaseEntries)
                  .map(([k, v]) => {
                    const keyStr = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
                    return `  ${keyStr}: { tag: ${JSON.stringify(v.tag)}, version: ${JSON.stringify(v.version)} },`;
                  })
                  .join("\n")}\n}`;
            content = content.replace(prereleaseBlockPattern, (_, prefix) => `${prefix}${formattedPrereleases};`);

            // Track community apps listed in public/launcher-catalog.toml (non-fatal if an external repo fails).
            const communityApps = [
              { id: "solidcraft", repo: "tangency-labs/solidcraft" },
              { id: "mailcraft", repo: "UCS-Care-Group/mailcraft" },
            ];
            const communityEntries = {};
            let communityQueryFailed = false;
            for (const community of communityApps) {
              const [cOwner, cRepo] = community.repo.split("/");
              try {
                const releases = await github.paginate(
                  github.rest.repos.listReleases,
                  { owner: cOwner, repo: cRepo, per_page: 50 },
                  response => response.data
                );
                let bestStable = null;
                let bestPre = null;
                let newestNightly = null;
                const published = releases
                  .filter(r => !r.draft)
                  .sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
                for (const rel of published) {
                  if (isNightlyTag(rel.tag_name)) {
                    if (!newestNightly) {
                      newestNightly = { tag: rel.tag_name, version: rel.tag_name.replace(/^[vV]/, "") };
                    }
                    continue;
                  }
                  const parsed = parseSemverTag(rel.tag_name);
                  if (!parsed) continue;
                  if (rel.prerelease || parsed.pre.length > 0) {
                    if (!bestPre || compareSemver(parsed, bestPre.parsed) > 0) {
                      bestPre = { parsed, tag: rel.tag_name, version: parsed.version };
                    }
                  } else if (!bestStable || compareSemver(parsed, bestStable.parsed) > 0) {
                    bestStable = { parsed, tag: rel.tag_name, version: parsed.version };
                  }
                }
                if (bestStable || bestPre || newestNightly) {
                  const entry = { repo: community.repo };
                  if (bestStable) entry.stable = { tag: bestStable.tag, version: bestStable.version };
                  if (bestPre) entry.prerelease = { tag: bestPre.tag, version: bestPre.version };
                  if (newestNightly) entry.nightly = newestNightly;
                  communityEntries[community.id] = entry;
                }
              } catch (err) {
                communityQueryFailed = true;
                core.warning(`Could not query community app ${community.repo}: ${err.message}`);
              }
            }

            const communityBlockPattern =
              /(export const CRAFT_COMMUNITY_RELEASES:\s*Record<string,\s*CraftCommunityAppReleases>\s*=\s*)\{[\s\S]*?\};/;
            if (!communityBlockPattern.test(content)) {
              throw new Error("Could not find CRAFT_COMMUNITY_RELEASES in crafting-app-releases.ts.");
            }
            const formattedCommunity = Object.keys(communityEntries).length === 0
              ? "{}"
              : `{\n${Object.entries(communityEntries)
                  .map(([k, v]) => {
                    const keyStr = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
                    const fields = [`repo: ${JSON.stringify(v.repo)}`];
                    for (const ch of ["stable", "prerelease", "nightly"]) {
                      if (v[ch]) {
                        fields.push(`${ch}: { tag: ${JSON.stringify(v[ch].tag)}, version: ${JSON.stringify(v[ch].version)} }`);
                      }
                    }
                    return `  ${keyStr}: { ${fields.join(", ")} },`;
                  })
                  .join("\n")}\n}`;
            if (communityQueryFailed) {
              // A failed query must not erase what an earlier run recorded: keep the declaration as is.
              core.warning("Keeping the recorded community releases because a query failed.");
            } else {
              content = content.replace(communityBlockPattern, (_, prefix) => `${prefix}${formattedCommunity};`);
            }
            fs.writeFileSync(file, content);

            core.info("Release versions updated successfully.");

      - name: Create or update pull request
        id: create-pr
        uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-craft-release-versions
          delete-branch: true
          commit-message: "chore: update Craft release versions"
          title: "chore: update Craft Launcher and app release versions"
          body: |
            ## Summary

            Automatically synchronize the Craft Launcher and Crafting Apps
            versions with the latest stable published releases in their
            respective GitHub repositories.

            ## Changes

            - Update versions from published stable releases only.
            - Ignore prereleases, drafts, and tags outside vX.Y.Z.
            - Validate all required release assets before updating the catalog.
            - Preserve catalog entries explicitly set to null.
            - Support pinned versions for intentional rollbacks.
            - Keep the existing release asset configuration unchanged.

            Generated by the `Update Craft Release Versions` workflow.
          labels: |
            automated
            dependencies

      # The repository does not allow GitHub's native auto-merge, so merge the PR directly.
      - name: Merge pull request
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              exit 0
            fi

            # A retry can race GitHub recording the first merge; treat that as success.
            if [ "$(gh pr view "$PR_NUMBER" --json state --jq .state)" = "MERGED" ]; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Merge attempt $attempt failed; retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "Unable to merge pull request $PR_NUMBER after 5 attempts." >&2
          exit 1

      # When triggered by a release state change that did not change version strings
      # (e.g. edited assets/SHA256SUMS or republished release), still trigger Cloudflare
      # so the static Linux repos and signed launcher-catalog.toml rebuild immediately.
      - name: Trigger Cloudflare deploy when no version PR was needed
        if: github.event_name == 'repository_dispatch' && steps.create-pr.outputs.pull-request-number == ''
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not configured; skipping direct deploy."
            exit 0
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --request POST "$DEPLOY_HOOK"

name: PR Backend Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fal-obj-zip-mime
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # pinned commit
        with:
          toolchain: 1.93.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake curl ffmpeg fontconfig git libclang-dev \
            libfontconfig1-dev libssl-dev musl-tools perl pkg-config
      - name: Check backend and test targets
        run: cargo check -p storyteller-web --tests
      - name: Run resolver tests without database fixtures
        run: cargo test -p storyteller-web --features skip_database_tests resolve_mesh_file_metadata

      - name: Run mesh uploader integration test with MySQL
        env:
          ARTCRAFT_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/artcraft_test
        run: cargo test -p storyteller-web --bin storyteller-web zip_obj_upload_stores_raw_obj_and_consistent_metadata

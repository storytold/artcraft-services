# The image build itself lives in craft-common-actions; this file only declares
# what is specific to artcraft-services: the 64-core runner the eight-binary
# Cargo build needs, the CPU Dockerfile, and the 12-character SHA tag that
# downstream consumers pin to.
name: "Build Docker image"

on:
  workflow_dispatch:
  push:
    branches:
      # NB: Default-branch doesn't work, despite Github's documentation.
      #- $default-branch
      - main
      - test
    # Only build when files that affect the Docker image change, so docs-only or
    # config-only pushes do not start a 15-25 minute build.
    paths:
      # Individual files
      - '.github/workflows/docker-publish-cpu.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build/service_cpu.Dockerfile'
      # Directories
      - '.sqlx/**'
      - '_database/**'
      - 'crates/**'
      - 'includes/**'
      - 'test_data/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # metadata-action's `type=sha,format=short` only yields a 7-character prefix,
  # but this image has always been tagged with 12, so it is computed here and
  # passed to the shared workflow as a tag rule.
  short-sha:
    name: Short SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - id: sha
        shell: bash
        env:
          COMMIT: ${{ github.sha }}
        run: echo "value=${COMMIT:0:12}" >> "$GITHUB_OUTPUT"

  publish:
    needs: short-sha
    uses: storytold/craft-common-actions/.github/workflows/docker-build.yml@main
    # GITHUB_TOKEN for GHCR, DOCKERHUB_USERNAME / DOCKERHUB_TOKEN for Docker Hub.
    secrets: inherit
    with:
      images: |
        ghcr.io/storytold/artcraft-services
        docker.io/storytold/artcraft-services
      platforms: '[{"platform":"linux/amd64","runner":"github-ubuntu-64core"}]'
      dockerfile: build/service_cpu.Dockerfile
      build-args: GIT_SHA=${{ github.sha }}
      free-disk: true
      cache-from: type=gha
      cache-to: type=gha,mode=max
      timeout-minutes: 45
      tags: |
        type=raw,value=latest
        type=raw,value=${{ github.sha }}
        type=raw,value=${{ needs.short-sha.outputs.sha }}
